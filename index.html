<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering portfolio</title>
<style>
:root{--paper:#eef1f5;--ink:#13213a;--mut:#56627a;--line:#c5cddb;--card:#fbfcfe;--acc:#1f4fd8;--grid:rgba(31,79,216,.08);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--paper:#0e1726;--ink:#e6ebf5;--mut:#98a4bb;--line:#26344d;--card:#142038;--acc:#7da2ff;--grid:rgba(125,162,255,.09)}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.serif,h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
a{color:var(--acc)}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{border-bottom:1px solid var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
header .wrap{padding-top:56px;padding-bottom:40px}
h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.02;margin:0 0 10px;letter-spacing:-.015em;font-weight:600}
.sub{font-size:1.15rem;color:var(--mut);margin:0 0 18px}
.about{max-width:60ch;margin:0;white-space:pre-line}
section{padding:34px 0 0}
h2{font-size:1.5rem;margin:0 0 14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);padding:1px 10px;font-size:14px;color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
button.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--ink);display:flex;flex-direction:column;cursor:pointer}
.card:hover{border-color:var(--acc);box-shadow:4px 4px 0 var(--acc)}
.card img,.ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-bottom:1px solid var(--ink)}
.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
.card .in{padding:14px 16px;flex:1}
.card h3{margin:0 0 8px;font-size:1.2rem;line-height:1.25;font-weight:600}
.tb{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--ink);font-size:13px}
.tb div{padding:6px 12px}
.tb div+div{border-left:1px solid var(--ink)}
.tb small{display:block;color:var(--mut);font-size:12px}
.contact{display:flex;flex-wrap:wrap;gap:6px 24px;margin:0}
footer{padding:48px 0 40px;color:var(--mut);font-size:14px}
#modal{position:fixed;inset:0;background:rgba(5,10,20,.65);overflow-y:auto;z-index:10}
#modal[hidden]{display:none}
.sheet{background:var(--paper);border:1px solid var(--ink);max-width:880px;margin:4vh auto;padding:24px;position:relative}
.x{position:absolute;top:12px;right:12px;background:var(--card);border:1px solid var(--ink);padding:4px 12px}
.hero{width:100%;max-height:62vh;object-fit:contain;background:var(--card);border:1px solid var(--line);display:block}
.cap{font-size:14px;color:var(--mut);margin:6px 0 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs button{padding:0;border:2px solid transparent;background:none}
.thumbs button.on{border-color:var(--acc)}
.thumbs img{width:76px;height:56px;object-fit:cover;display:block}
.sheet h2.t{font-size:2rem;margin:20px 0 10px;line-height:1.15}
.sheet .tb{border:1px solid var(--ink);margin-bottom:12px}
.blk{margin-top:22px}
.blk h3{font-size:1.15rem;margin:0 0 4px;font-weight:600}
.blk p{margin:0;white-space:pre-line;max-width:68ch}
table{border-collapse:collapse;width:100%;max-width:520px}
td{padding:6px 10px;border:1px solid var(--line);font-size:15px}
td:first-child{color:var(--mut);width:45%}
.err{padding:60px 22px;max-width:560px;margin:0 auto}
@media(max-width:600px){.sheet{margin:0;min-height:100%;border:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-label="Project details"></div>
<script>
const $=s=>document.querySelector(s),app=$("#app"),M=$("#modal");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chips=a=>(a||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("");
const photos=p=>(p.photos||[]).map(x=>typeof x==="string"?{src:x,caption:""}:x);
let D,filter="All",openId=null,idx=0,last=null;

function href(v){return v.includes("@")?"mailto:"+v:/^https?:\/\//.test(v)?v:"https://"+v}
function block(p){return `<div class="tb"><div><small>Role</small>${esc(p.role)||"&nbsp;"}</div><div><small>Dates</small>${esc(p.dates)||"&nbsp;"}</div></div>`}

function render(){
  const ps=D.projects||[],tags=["All",...new Set(ps.flatMap(p=>p.tags||[]))];
  const list=ps.filter(p=>filter==="All"||(p.tags||[]).includes(filter));
  const c=D.contact||{},links=Object.entries(c).filter(([,v])=>v).map(([k,v])=>`<p style="margin:0">${esc(k[0].toUpperCase()+k.slice(1))}: <a href="${esc(href(v))}" rel="noopener">${esc(v)}</a></p>`).join("");
  app.innerHTML=`
  <header><div class="wrap"><h1>${esc(D.name)}</h1><p class="sub">${esc(D.title)}</p><p class="about">${esc(D.about)}</p></div></header>
  <main class="wrap">
   ${(D.skills||[]).length?`<section><h2>Skills and tools</h2><div class="chips">${chips(D.skills)}</div></section>`:""}
   <section><h2>Projects</h2>
    <div class="chips">${tags.map(t=>`<button class="chip ${t===filter?"on":""}" data-filter="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="grid">${list.map(p=>{const ph=photos(p)[0];return `<article class="card" tabindex="0" data-open="${esc(p.id)}">
      ${ph?`<img src="${esc(ph.src)}" alt="" loading="lazy">`:'<div class="ph">Photo coming soon</div>'}
      <div class="in"><h3>${esc(p.title)}</h3><div class="chips">${chips(p.tags)}</div></div>${block(p)}</article>`}).join("")}</div></section>
   ${links?`<section><h2>Contact</h2><div class="contact">${links}</div></section>`:""}
  </main><footer><div class="wrap">${esc(D.name)}</div></footer>`;
}

function modal(){
  const p=(D.projects||[]).find(x=>x.id===openId);
  if(!p){M.hidden=true;M.innerHTML="";document.body.style.overflow="";return}
  const ph=photos(p);idx=Math.min(idx,Math.max(ph.length-1,0));
  const specs=Object.entries(p.specs||{}).filter(([,v])=>v);
  const secs=[["objective","Objective"],["approach","Design and approach"],["results","Results and lessons"]].filter(([k])=>p[k]);
  M.hidden=false;document.body.style.overflow="hidden";
  M.innerHTML=`<div class="sheet"><button class="x" data-close>Close</button>
   ${ph.length?`<img class="hero" src="${esc(ph[idx].src)}" alt="${esc(ph[idx].caption||p.title)}">${ph[idx].caption?`<p class="cap">${esc(ph[idx].caption)}</p>`:""}
   ${ph.length>1?`<div class="thumbs">${ph.map((x,i)=>`<button class="${i===idx?"on":""}" data-photo="${i}" aria-label="Photo ${i+1}"><img src="${esc(x.src)}" alt=""></button>`).join("")}</div>`:""}`:'<div class="ph" style="aspect-ratio:16/7;border:1px solid var(--line)">Photos coming soon</div>'}
   <h2 class="t">${esc(p.title)}</h2>${block(p)}<div class="chips">${chips(p.tags)}${chips(p.tools)}</div>
   ${secs.map(([k,l])=>`<div class="blk"><h3>${l}</h3><p>${esc(p[k])}</p></div>`).join("")}
   ${specs.length?`<div class="blk"><h3>Key specs</h3><table>${specs.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></div>`:""}</div>`;
  M.querySelector(".x").focus();
}
function open(id){last=document.activeElement;openId=id;idx=0;history.replaceState(null,"","#"+id);modal()}
function close(){openId=null;history.replaceState(null,"",location.pathname+location.search);modal();if(last&&last.focus)last.focus()}

document.addEventListener("click",e=>{
  if(e.target===M)return close();
  const t=e.target.closest("[data-filter],[data-open],[data-close],[data-photo]");if(!t)return;
  if(t.dataset.filter!==undefined){filter=t.dataset.filter;render()}
  else if(t.dataset.open!==undefined)open(t.dataset.open);
  else if(t.dataset.close!==undefined)close();
  else if(t.dataset.photo!==undefined){idx=+t.dataset.photo;modal()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&openId)close();
  else if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.open)open(e.target.dataset.open);
  else if(openId&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const n=photos((D.projects||[]).find(x=>x.id===openId)||{}).length;if(n>1){idx=(idx+(e.key==="ArrowRight"?1:n-1))%n;modal()}}
});

fetch("data.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  D=d;document.title=d.name+" | Engineering portfolio";render();
  if(location.hash.length>1){openId=decodeURIComponent(location.hash.slice(1));modal()}
}).catch(()=>{app.innerHTML='<div class="err"><h1 style="font-size:2rem">Couldn’t load data.json</h1><p>Check that data.json sits next to index.html and that its commas and quotes are correct. If you opened this file directly from your computer, run <code>python3 -m http.server</code> in this folder and visit localhost:8000 instead.</p></div>'});
</script>
</body>
</html>
